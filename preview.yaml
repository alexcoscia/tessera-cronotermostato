  options: {room: sensor.studio_programma}
  sizes: [2x2]
- tile: room
  name: Mansarda
  entity: climate.mansarda
  options: {room: sensor.mansarda_programma}
  sizes: [2x2]
- tile: room
  name: Lunga
  entity: climate.lunga
  options: {room: sensor.lunga_programma}
  sizes: [2x2, 3x2]
- tile: room
  name: Offline
