  sizes: [2x2]
- tile: room
  name: Ripostiglio
  entity: climate.ripostiglio
  options: {room: sensor.ripostiglio_programma}
  sizes: [2x2]
- tile: room
  name: Troppo grande
  entity: climate.soggiorno
  options: {room: sensor.soggiorno_programma}
  sizes: [2x2]
  data: {wait: too_large}
- tile: room
  name: Soggiorno grande
  entity: climate.grande
  options: {room: sensor.grande_programma}
  sizes: [2x2]
states:
  climate.soggiorno:
    state: heat
    attributes: {min_temp: 7, max_temp: 35, target_temp_step: 0.5, temperature: 21.5, current_temperature: 19.8, hvac_action: heating}
  sensor.soggiorno_programma:
    state: Settimana
    attributes:
      today_start: [0, 360, 510, 1020, 1350]
      today_end: [360, 510, 1020, 1350, 1440]
      today_mode: [1, 1, 0, 1, 1]
      today_temp: [17, 21, -100, 21.5, 17]
      today_auto: [0, 0, 1, 0, 0]
      slot_mode: 1
      slot_temp: 21.5
      slot_end_time: '{epoch+90m}'
      next_mode: 1
      next_temp: 18
      next_start_time: '{epoch+90m}'
