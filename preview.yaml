# Made-up rooms with data as the integration 0.2.0 gives it (the first example is the one the store picture shows).
# Moments are epoch seconds (`*_time`: "{epoch+90m}" is 90 minutes from the run); -100 in `today_temp` is a band without
# a temperature; today_mode is 0 off, 1 heat, 2 cool; a day is 0-1440 minutes of the wall clock.
time_zone: Europe/Rome
tiles:
- tile: room
  name: Soggiorno
  entity: climate.soggiorno
  options: {room: sensor.soggiorno_programma}
  sizes: [2x2, 3x2]
- tile: room
  name: Camera
  entity: climate.camera
  options: {room: sensor.camera_programma}
  sizes: [2x2, 3x2]
- tile: room
  name: Fresco
  entity: climate.fresco
  options: {room: sensor.fresco_programma}
  sizes: [2x2, 3x2]
- tile: room
