# Made-up rooms with data as the integration gives it (0.3.0: today_flags bit 1 = automatic band, bit 2 = locked; edit_info, edit_seq, edit_n) (the first example is the one the store picture shows).
# Moments are epoch seconds (`*_time`: "{epoch+90m}" is 90 minutes from the run); -100 in `today_temp` is a band without
# a temperature; today_mode is 0 off, 1 heat, 2 cool; a day is 0-1440 minutes of the wall clock.
time_zone: Europe/Rome
tiles:
- tile: room
  name: Soggiorno
  entity: climate.soggiorno
  options: {room: sensor.soggiorno_programma}
  sizes: [2x2, 3x2]
# The small sizes (1x1, 2x1, 1x2): the bench tries each on every screen, and what is drawn depends on the pixels of the cell.
- tile: room
  name: Soggiorno
  entity: climate.soggiorno
  options: {room: sensor.soggiorno_programma}
  sizes: [1x1, 2x1, 1x2]
- tile: room
