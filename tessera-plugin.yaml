# Cronotermostato: a room tile for the cronotermostato Home Assistant integration (weekly programs for climate
# entities): the target temperature with plus and minus keys, and a bar with today's bands of the room's program.
# Every field is explained in docs/MANIFEST.md of tessera-plugins.
id: cronotermostato
version: 0.1.1
api: "0.24"
icon: thermometer
maintainer: alexcoscia
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 8

permissions:
  # The keys call the integration's two services; they are not climate.* actions. The screen only sends them.
  home_assistant_actions: [cronotermostato.set_manual, cronotermostato.resume_auto]

cards:
  # The list of today's bands, opened by a tap on the bar.
  - { id: day, name: card_name }

tiles:
  - id: room
    name: tile_name
    icon: thermometer
    # From 1x1: the editor starts a tile at one cell and grows it one axis at a time, so a larger minimum shows no
    # handles at all. The tile draws what the pixels of its cell hold (choose_layout): the full look with the keys,
    # the temperatures and the bar when they fit, a row with the keys (wide, low), a column with the bar (narrow,
    # tall), or the target alone (narrow, low). Not larger than 3x2: past that the screen is mostly empty space (seen
    # on the 10-inch at 4x4), and a third row would show nothing more.
    sizes: { min: 1x1, max: 3x2 }
    # 21 blocks (16 bands, the track, the "now" tick, the dot, 2 keys) and 7 labels (name, target, now, then, pill, 2 on the keys), plus the bands the tile keeps.
    memory: 3000
    domains: [climate]
    # What the tile reads of the climate: the target and the temperature now, the keys' limits and step, the action.
    attributes: [temperature, current_temperature, min_temp, max_temp, target_temp_step, hvac_action]
    example: tile_example
    preview: { title: "{name}", value: "{temperature}" }
    options:
      # The room's program sensor of the integration (sensor.<room>_programma). An option cannot filter with
      # has_attributes (only a tile's own entity can), so the inspector offers every sensor: the hint says which.
      # 15 attributes (the most is 16): today's bands as parallel lists of numbers, the band now
      # and the next (mode 0 off / 1 heat / 2 cool), and the state of the override. Moments come as epoch seconds.
      - id: room
        kind: entity
        domains: [sensor]
        attributes: [today_start, today_end, today_mode, today_temp, today_auto, slot_mode, slot_temp, slot_end_time, next_mode, next_temp, next_start_time, manual, override_until_time, status, holiday]
        label: room
        hint: room_hint
