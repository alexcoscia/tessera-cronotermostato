# Cronotermostato: a room tile for the cronotermostato Home Assistant integration (weekly programs for climate entities).
# THIS IS THE SPIKE VERSION (Passo 0 of the plan): a provisional tile to try the API, not the final tile. See SPIKE.md.
# Every field is explained in docs/MANIFEST.md of tessera-plugins.
id: cronotermostato
version: 0.1.0
api: "0.24"
icon: thermometer
maintainer: alexcoscia
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 6

permissions:
  # The integration's two services (another integration's, not climate.*), and climate.set_temperature as the fallback.
  home_assistant_actions: [cronotermostato.set_manual, cronotermostato.resume_auto, climate.set_temperature]

cards:
  - { id: day, name: card_name }

tiles:
  - id: room
    name: tile_name
    icon: thermometer
    sizes: { min: 2x2, max: 4x4 }
    memory: 3000
    domains: [climate]
    attributes: [temperature, current_temperature, min_temp, max_temp, target_temp_step, hvac_action]
    example: tile_example
    preview: { title: "{name}", value: "{temperature}" }
    options:
      # The room's schedule sensor of the integration: today's bands travel as parallel lists of numbers.
      - id: room
        kind: entity
        domains: [sensor]
        attributes: [today_start, today_end, today_mode, today_temp, today_auto, slot, next_slot, slot_end, manual, override_until, status]
        label: room
        hint: room_hint
      # Spike only: which probe a tap on the tile runs (see SPIKE.md).
      - { id: probe, kind: text, label: probe, hint: probe_hint }
